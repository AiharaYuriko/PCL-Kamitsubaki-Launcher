name: Build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:
       matrix:
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build launcher
      shell: pwsh
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      run: ./scripts/Build-Launcher.ps1 -Configuration '${{ matrix.configuration }}'

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: artifacts/${{ matrix.configuration }}/
        if-no-files-found: error
