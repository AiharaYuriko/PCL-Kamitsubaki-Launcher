name: Sync launcher release to S3

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (vX.Y.Z.W)
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){3}$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            | jq -e '(.isDraft or .isPrerelease) | not' >/dev/null
          gh release download "$RELEASE_TAG" \
            --pattern PCL-Kamitsubaki.exe --pattern update.json --dir "$RUNNER_TEMP/pcl-release"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install S3 SDK
        run: python3 -m pip install 'boto3==1.40.76'

      - name: Verify and sync launcher release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: RELEASE_DIRECTORY="$RUNNER_TEMP/pcl-release" python3 scripts/Sync-LauncherRelease.py
